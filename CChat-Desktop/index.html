<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CChat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: #0B0F17; color: #E2E8F0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Titlebar drag area for native window feel */
    .titlebar { height: 38px; background: #0B0F17; -webkit-app-region: drag; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #1E293B; }
    .titlebar span { font-size: 12px; color: #64748B; font-weight: 600; letter-spacing: 0.5px; }

    /* Desktop 3-Column Layout */
    .app-container { display: flex; flex: 1; height: calc(100vh - 38px); overflow: hidden; }

    /* Column 1: Rail Navigation */
    .rail-nav { width: 68px; background: #0F172A; border-right: 1px solid #1E293B; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 20px; }
    .rail-icon { width: 42px; height: 42px; border-radius: 12px; background: #1E293B; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #94A3B8; transition: all 0.15s ease; }
    .rail-icon:hover, .rail-icon.active { background: #2563EB; color: #FFFFFF; }

    /* Column 2: Secondary Navigation Panel */
    .nav-panel { width: 300px; background: #111827; border-right: 1px solid #1E293B; display: flex; flex-direction: column; }
    .panel-header { padding: 18px 16px; border-bottom: 1px solid #1E293B; }
    .panel-header h2 { font-size: 18px; color: #F8FAFC; }
    .search-box { margin-top: 12px; background: #1F2937; border: 1px solid #374151; border-radius: 8px; padding: 8px 12px; color: #F3F4F6; width: 100%; outline: none; font-size: 13px; }
    
    .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.15s ease; margin-bottom: 2px; }
    .chat-item:hover { background: #1F2937; }
    .chat-item.active { background: #1E3A8A; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #374151; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #F9FAFB; position: relative; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22C55E; position: absolute; bottom: 0; right: 0; border: 2px solid #111827; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-size: 14px; font-weight: 500; color: #F3F4F6; }
    .chat-preview { font-size: 12px; color: #9CA3AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Column 3: Main Active Stage */
    .main-stage { flex: 1; display: flex; flex-direction: column; background: #0B0F17; }
    .stage-header { height: 64px; border-bottom: 1px solid #1E293B; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #0F172A; }
    .messages-area { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* Apple-inspired Message Bubbles */
    .msg-bubble { max-width: 60%; padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; user-select: text; }
    .msg-incoming { background: #1F2937; color: #F3F4F6; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-outgoing { background: #2563EB; color: #FFFFFF; align-self: flex-end; border-bottom-right-radius: 4px; }

    /* Composer */
    .composer { padding: 16px 24px; background: #0F172A; border-top: 1px solid #1E293B; display: flex; gap: 12px; align-items: center; }
    .composer input { flex: 1; background: #1F2937; border: 1px solid #374151; border-radius: 20px; padding: 12px 18px; color: #F3F4F6; outline: none; font-size: 14px; }
    .send-btn { background: #2563EB; color: #FFFFFF; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease; }
    .send-btn:hover { background: #1D4ED8; }

    /* Right Side Panel: Chat Details */
    .details-panel { width: 280px; background: #111827; border-left: 1px solid #1E293B; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    .details-avatar { width: 80px; height: 80px; border-radius: 50%; background: #374151; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="titlebar"><span>CCHAT DESKTOP</span></div>
  <div class="app-container">
    <div class="rail-nav">
      <div class="rail-icon active">💬</div>
      <div class="rail-icon">👥</div>
      <div class="rail-icon">📁</div>
      <div class="rail-icon">⚙️</div>
    </div>
    <div class="nav-panel">
      <div class="panel-header">
        <h2>Messages</h2>
        <input type="text" class="search-box" placeholder="Search conversations...">
      </div>
      <div class="chat-list">
        <div class="chat-item active">
          <div class="avatar">A<div class="status-dot"></div></div>
          <div class="chat-info">
            <div class="chat-name">Alex</div>
            <div class="chat-preview">Hey, ready for class?</div>
          </div>
        </div>
      </div>
    </div>
    <div class="main-stage">
      <div class="stage-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="avatar">A</div>
          <div>
            <div style="font-weight:600; color:#F8FAFC;">Alex</div>
            <div style="font-size:12px; color:#22C55E;">Online</div>
          </div>
        </div>
      </div>
      <div class="messages-area">
        <div class="msg-bubble msg-incoming">Hey, ready for class?</div>
        <div class="msg-bubble msg-outgoing">Yeah, almost there!</div>
      </div>
      <div class="composer">
        <input type="text" placeholder="Write a message...">
        <button class="send-btn">➔</button>
      </div>
    </div>
    <div class="details-panel">
      <div class="details-avatar">A</div>
      <h3 style="color:#F8FAFC; font-size:16px;">Alex</h3>
      <p style="color:#9CA3AF; font-size:12px; margin-top:4px;">Available</p>
    </div>
  </div>
</body>
</html>
